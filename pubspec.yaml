name: BioSmart
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+4

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  camera: ^0.12.0+1
  video_player: ^2.11.1
  path_provider: ^2.1.6
  google_mlkit_pose_detection: ^0.11.0
  # --- NUEVA LIBRERÍA PARA QUE LA APP HABLE ---
  flutter_tts: ^3.8.3
  flutter_screen_recording: ^2.0.25
  cloudflare_r2: ^0.0.14
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_lints: ^6.0.0

  # --- PAQUETES PARA ÍCONO Y SPLASH ---
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

# --- CONFIGURACIÓN DEL ÍCONO DEL LAUNCHER ---
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#050505"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"

flutter_native_splash:
  color: "#050505"
  image: assets/images/logo_foreground.png
  android_12:
    image: assets/images/logo_foreground.png
    color: "#050505"

flutter:
  uses-material-design: true

  # Aquí está la corrección: Declaramos el .env respetando los espacios
  assets:
    - .env
    - assets/images/